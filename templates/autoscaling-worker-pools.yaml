{{- $top := $ }}
{{- if (include "tonic.isWorkerEnabled" $top) }}
{{- $autoscalingPools := $top.Values.workerPools }}
{{- if $autoscalingPools -}}
{{- range $i, $autoscalingPool := $autoscalingPools }}
{{ include "tonic.worker.autoscalingPool" (list $top $autoscalingPool) }}
{{- end }}
{{- end }}
{{- end }}
