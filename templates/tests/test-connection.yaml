{{- if .Values.enableTests }}
{{- if (include "tonic.isWebServerEnabled" .) }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "tonic.fullname" . }}-test-connection"
  labels:
    {{- include "tonic.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      {{- $domain := (include "tonic.web.host" .) }}
      {{- $args := (list (printf "%s:443" $domain)) }}
      args: {{ toJson $args }}
  restartPolicy: Never
{{- end }}
{{- end }}
