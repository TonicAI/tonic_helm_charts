{{- $top := $ }}
{{- if (include "tonic.isWebServerEnabled" $top) }}
{{- $ssoConfig := $top.Values.tonicSsoConfig }}
{{- if ($ssoConfig).clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  annotations:
    {{- include "tonic.annotations" (list $top) | nindent 4 }}
  labels:
    {{- include "tonic.allLabels" (list $top) | nindent 4 }}
  name: tonic-sso-client-secret
type: Opaque
data:
  secret: {{ $ssoConfig.clientSecret | b64enc }}
{{- end }}
{{- end }}
