{{- $top := $ }}
{{- if (include "tonic.isWebServerEnabled" $top) }}
{{- $server := .Values.tonicai.web_server -}}
{{- $ports := fromYaml (include "tonic.ports" (list $top $server.ports (dict "httpsOnly" true)))  }}
{{- $annotations := dict }}
{{- if (($top.Values.tonicai).web_server).annotations }}
{{- $annotations = $top.Values.tonicai.web_server.annotations }}
{{- else }}
{{- $annotations = (dict
    "service.beta.kubernetes.io/aws-load-balancer-internal" "true"
    "service.beta.kubernetes.io/aws-load-balancer-nlb-target-type" "ip"
    "service.beta.kubernetes.io/aws-load-balancer-scheme" "internal"
    "service.beta.kubernetes.io/aws-load-balancer-type" "nlb"
    "service.beta.kubernetes.io/azure-load-balancer-internal" "true"
)}}
{{- end }}
{{- $serviceType := include "tonic.web.serviceType" (list $top) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tonic.web.serviceName" (list $) }}
  namespace: {{ $top.Release.Namespace }}
  annotations:
    {{- include "tonic.annotations" (list $top $annotations) | nindent 4 }}
  labels:
    {{- include "tonic.allLabels" (list $top (dict "app" "tonic-web-server")) | nindent 4 }}
spec:
  ports:
  {{- if not $ports.httpsOnly }}
  - name: "http"
    port: 80
    targetPort: http
  {{- end }}
  - name: "https"
    port: 443
    targetPort: https
  type: {{ $serviceType }}
  selector:
    app: tonic-web-server
{{- end }}
